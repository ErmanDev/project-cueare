name: ssc_qr_attendance
description: "SSC QR Attendance — LAN-only QR event attendance app (Superadmin / Moderator / Student)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

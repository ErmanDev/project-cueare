name: ssc-attendance

services:
  database:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file:
      - ${SSC_ENV_FILE:-./staging.env}
    volumes:
      # PostgreSQL 18+ stores versioned data below this volume root.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.5
    networks:
      - backend

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        RELEASE_VERSION: local-staging
        RELEASE_REVISION: local
    command: ["bun", "run", "migrate:up"]
    restart: "no"
    env_file:
      - ${SSC_ENV_FILE:-./staging.env}
    environment:
      APP_ENV: staging
      AUTO_MIGRATE: "false"
      DATABASE_HOST: database
      LISTEN_HOST: 0.0.0.0
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        RELEASE_VERSION: local-staging
        RELEASE_REVISION: local
    restart: unless-stopped
    env_file:
      - ${SSC_ENV_FILE:-./staging.env}
    environment:
      APP_ENV: staging
      AUTO_MIGRATE: "false"
      DATABASE_HOST: database
      LISTEN_HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
